name: Verificar diseñador de robots

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/disenador-robot-3d]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tecnorosario.ar-—-soluciones-digitales
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tecnorosario.ar-—-soluciones-digitales/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar TypeScript
        run: npm run lint
      - name: Compilar con Vite
        run: npm run build
